{%extends "base.html"%}

{% block title %} {{ camp }} {% endblock %}

{% block content %}
<div class="container px-4 py-5" id="custom-cards">
    <h2 class="pb-2 border-bottom">{{ camp }}</h2>
    <div class="row row-cols-1 row-cols-lg-2 align-items-stretch g-4 py-5">
        {% for assignment in camp.assignments.all %}
            <div class="col">
                <div class="card card-cover h-100 overflow-hidden rounded-4 shadow-lg" style="background-image: url('unsplash-photo-1.jpg');">
                    <div class="d-flex flex-column h-100 p-5 pb-3 fg-white text-shadow-1">
                        <a href="/edit/assignment/{{ assignment.id }}" class="stretched-link"></a>
                        <h3 class="pt-5 mt-5 mb-4 fs-3xl lh-1 fw-bold">{{ assignment }}</h3>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
