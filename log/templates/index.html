{%extends "base.html"%}

{% block title %} Campsites {% endblock %}

{% block content %}
<div class="container px-4 py-5" id="custom-cards">
    <h2 class="pb-2 border-bottom">Campsites</h2>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 align-items-stretch g-4 py-5">
        {% for camp in campsites %}
            <div class="col">
                <a href="/camp/{{ camp.id }}" class="stretched-link"></a>
                <div class="card card-cover h-100 overflow-hidden rounded-4 shadow-lg" style="background-image: url('unsplash-photo-1.jpg');">
                    <div class="d-flex flex-column h-100 p-5 pb-3 fg-white text-shadow-1">
                        <h3 class="pt-5 mt-5 mb-4 fs-3xl lh-1 fw-bold">{{ camp.name }} {{ camp.year }}</h3>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
