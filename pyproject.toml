[project]
name = "quartermasterlog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crispy-bootstrap5>=2026.9",
    "django>=6.1.2",
    "django-crispy-forms>=2.7",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs>=6.1.2",
    "django-stubs-ext>=6.1.2",
]
prod = [
    "gunicorn>=26.2.0",
]

[tool.uv]
link-mode = "symlink"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "myproject.settings"
